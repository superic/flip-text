<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ox-Turn Reader</title>
  <meta name="description" content="A book reader that tests alternating-direction (boustrophedon) reading.">
  <meta name="theme-color" content="#F5EFE4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ox-Turn">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/figtree/figtree-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Library -->
  <main id="library" class="screen scroll" hidden>
    <div class="wrap">
      <header class="lib-header">
        <div>
          <h1>Ox-Turn</h1>
          <p class="tagline">Reading, there and back again</p>
        </div>
        <a class="round-btn" href="#/stats" aria-label="Reading stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3" /></svg>
        </a>
      </header>
      <section id="continue" aria-label="Continue reading" hidden></section>
      <div id="install-area"></div>
      <section class="books" aria-labelledby="books-title">
        <h2 class="eyebrow" id="books-title">Your books</h2>
        <div id="shelf" class="shelf" aria-live="polite"><p class="muted">Loading books…</p></div>
      </section>
      <p class="lib-foot">
        <button type="button" class="linkish" id="how-install">How to install</button>
      </p>
    </div>
  </main>

  <!-- Reader -->
  <section id="reader" class="screen reader" hidden>
    <div id="stage" class="stage" aria-live="off"></div>
    <div id="reader-ui" class="reader-ui">
      <div class="bar top-bar">
        <button type="button" class="back-btn" data-act="library" aria-label="Back to Library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg><span>Library</span>
        </button>
        <div class="bar-group">
          <button type="button" class="icon-btn list" data-act="contents" aria-label="Contents">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" /><circle cx="4.5" cy="6" r="1" /><circle cx="4.5" cy="12" r="1" /><circle cx="4.5" cy="18" r="1" /></svg>
          </button>
          <button type="button" class="icon-btn aa" data-act="settings" aria-label="Reading settings">Aa</button>
        </div>
      </div>
      <div class="bar bottom-bar">
        <div class="ui-heading">
          <span class="ui-label" id="ui-label"></span>
          <span class="ui-chapter" id="ui-chapter"></span>
        </div>
        <input type="range" class="range" id="ui-scrub" min="1" max="1" step="1" value="1" aria-label="Page in chapter">
        <div class="ui-pages"><span id="ui-page"></span><span id="ui-left"></span></div>
      </div>
    </div>

    <div id="contents-sheet" class="sheet-wrap" hidden>
      <div class="sheet sheet-full" role="dialog" aria-label="Contents">
        <div class="toc-head">
          <div><h2>Contents</h2><p class="toc-sub" id="toc-sub"></p></div>
          <button type="button" class="close-btn" data-close aria-label="Close contents">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <ol class="toc scroll" id="toc"></ol>
      </div>
    </div>

    <div id="settings-sheet" class="sheet-wrap" hidden>
      <div class="backdrop" data-close></div>
      <div class="sheet" role="dialog" aria-label="Reading settings">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head"><h2>Reading settings</h2><button type="button" class="btn done" data-close>Done</button></div>
        <div class="sheet-body scroll" id="settings-body"></div>
      </div>
    </div>
  </section>

  <!-- Stats -->
  <section id="stats" class="screen scroll" hidden>
    <div class="wrap" id="stats-body"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Off-screen container used to measure line breaks -->
  <div id="measure" class="measure text" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
